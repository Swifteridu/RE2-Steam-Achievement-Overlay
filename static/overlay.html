<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steam Achievement Overlay</title>
<style>
:root{color-scheme:dark;--red:#c52b31;--red-bright:#ef555d;--text:#f3f0ea;--muted:#b5bbb8;--line:rgba(221,226,220,.18);--green:#b5dfbf}
*{box-sizing:border-box}
html,body{margin:0;width:100%;background:transparent;color:var(--text);font-family:"Segoe UI",Arial,sans-serif}
body{overflow:hidden}
#stage{width:100%;padding:8px;}
.summary{position:relative;overflow:hidden;background:linear-gradient(112deg,rgba(30,35,36,.985),rgba(8,11,12,.985) 72%);border:1px solid rgba(220,226,220,.30);border-top:5px solid var(--red);box-shadow:0 14px 44px #0009;padding:20px 26px 17px}
.summary:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.075;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px,transparent 5px);mix-blend-mode:soft-light}
.eyebrow{position:relative;z-index:1;color:#e46a70;font-size:12px;letter-spacing:.24em;font-weight:950;text-transform:uppercase}
.game-name{position:relative;z-index:1;margin-top:7px;font-size:clamp(25px,3.15vw,43px);line-height:1.05;font-weight:950;letter-spacing:.035em;text-transform:uppercase;overflow-wrap:anywhere;text-shadow:0 3px 18px #000a}
.stats{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-top:17px}
.count{font-size:clamp(36px,4.4vw,55px);line-height:.95;font-weight:950;letter-spacing:-.025em;font-variant-numeric:tabular-nums;white-space:nowrap}
.count span{font-size:clamp(18px,2vw,25px);color:#c4cac6;font-weight:650;letter-spacing:0}
.percent{font-size:clamp(18px,2vw,25px);font-weight:900;color:#eee9e1;font-variant-numeric:tabular-nums}
.bar{position:relative;z-index:1;height:11px;background:#424849;margin-top:14px;overflow:hidden;border-radius:2px}
.bar-fill{height:100%;width:0;background:linear-gradient(90deg,#812027,#ed555d);transition:width .5s ease}
.meta{position:relative;z-index:1;display:flex;justify-content:space-between;gap:12px;margin-top:10px;color:#aeb6b2;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.status{position:relative;z-index:1;margin-top:8px;font-size:10px;color:#90bb9d;letter-spacing:.13em;font-weight:800;text-transform:uppercase}
.status.stale{color:#e1b26b}.status.offline{color:#e28c91}
.pinned{margin-top:11px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pinned[hidden]{display:none}
.pin-card{min-width:0;min-height:112px;display:flex;align-items:center;gap:13px;padding:13px;background:linear-gradient(120deg,rgba(31,37,37,.97),rgba(12,16,17,.97));border:1px solid rgba(210,218,211,.24);border-left:3px solid #a8c6ae;box-shadow:0 7px 24px #0007}
.pin-card.locked{border-left-color:#c34a50}
.pin-card img{width:62px;height:62px;flex:0 0 62px;object-fit:contain;background:#080b0c;border:1px solid #4b5351;padding:2px}
.pin-copy{min-width:0;flex:1}
.pin-kicker{font-size:10px;font-weight:950;letter-spacing:.16em;color:#d46a70;text-transform:uppercase;margin-bottom:4px}
.pin-name{font-size:clamp(15px,1.55vw,19px);font-weight:900;line-height:1.14;overflow-wrap:anywhere}
.pin-description{font-size:clamp(11px,1.12vw,13px);line-height:1.25;color:#c0c6c1;margin-top:5px}
.pin-state{display:inline-block;margin-top:7px;padding:3px 6px;border:1px solid #56645a;color:#b9d8c0;background:#17231b;font-size:9px;letter-spacing:.12em;font-weight:950}
.pin-card.locked .pin-state{border-color:#754348;color:#f0adb0;background:#291719}
.toast{position:fixed;z-index:10;top:14px;left:14px;right:14px;display:flex;align-items:center;gap:14px;padding:14px 17px;background:linear-gradient(105deg,#5b1a20,#181d1e);border:1px solid #e26369;box-shadow:0 12px 32px #000c;opacity:0;transform:translateY(-145%);transition:opacity .3s ease,transform .3s ease;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}.toast img{width:52px;height:52px;object-fit:contain}.toast-label{font-size:10px;letter-spacing:.2em;color:#f08e93;font-weight:950}.toast-name{font-size:18px;font-weight:900;margin-top:3px}
.error{padding:20px;background:rgba(15,18,19,.96);border:1px solid rgba(220,226,220,.25);border-top:4px solid var(--red);color:#e9b0b2;font-size:15px;font-weight:700}
@media(max-width:650px){#stage{padding:5px}.summary{padding:15px 16px 13px}.pinned{grid-template-columns:1fr}.pin-card{min-height:88px}.pin-card img{width:54px;height:54px;flex-basis:54px}.stats{margin-top:13px}.bar{height:8px}}
</style>
</head>
<body>
<div id="stage">
  <section class="summary" id="summary">
    <div class="eyebrow">Steam · Achievement progress</div>
    <div class="game-name" id="gameName">Steam Achievement Overlay</div>
    <div class="stats">
      <div class="count" id="count">-- <span>/ --</span></div>
      <div class="percent" id="percent">--%</div>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="meta"><span>Completion status</span><span id="remaining">Waiting for Steam…</span></div>
    <div class="status" id="status">Waiting for local helper</div>
  </section>
  <section class="pinned" id="pinned" hidden aria-label="Pinned achievements"></section>
</div>
<div class="toast" id="toast"><img id="toastIcon" alt=""><div><div class="toast-label">ACHIEVEMENT UNLOCKED</div><div class="toast-name" id="toastName"></div></div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let firstLoad=true,seenEvents=new Set(),toastQueue=[],toastBusy=false;
let toastTimer=null;
const migratedLegacyScopes=new Set();
const pinnedEl=document.getElementById('pinned');
function showNextToast(){
 if(toastBusy||!toastQueue.length)return;
 toastBusy=true;
 const event=toastQueue.shift();
 document.getElementById('toastName').textContent=event.name||'Achievement unlocked';
 document.getElementById('toastIcon').src=event.icon||'';
 const toast=document.getElementById('toast');toast.classList.add('show');
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>{toast.classList.remove('show');toastBusy=false;setTimeout(showNextToast,380);},5200);
}
function renderPinned(items){
 if(!Array.isArray(items)||!items.length){pinnedEl.hidden=true;pinnedEl.innerHTML='';return;}
 pinnedEl.hidden=false;
 pinnedEl.innerHTML=items.slice(0,3).map((item,index)=>`
  <article class="pin-card ${item.unlocked?'':'locked'}">
   <img src="${esc(item.unlocked?(item.icon||item.icon_gray):(item.icon_gray||item.icon))}" alt="" onerror="this.style.visibility='hidden'">
   <div class="pin-copy"><div class="pin-kicker">PINNED OBJECTIVE ${index+1}</div><div class="pin-name">${esc(item.name)}</div><div class="pin-description">${esc(item.description||'Achievement details unavailable.')}</div><span class="pin-state">${item.unlocked?'UNLOCKED':'STILL LOCKED'}</span></div>
  </article>`).join('');
}
function render(data){
 document.getElementById('gameName').textContent=data.game_name||'Steam Achievement Overlay';
 const total=Number(data.total||0),unlocked=Number(data.unlocked||0),remaining=Math.max(0,total-unlocked),percent=total?Math.round(unlocked/total*100):0;
 document.getElementById('count').innerHTML=`${unlocked} <span>/ ${total}</span>`;
 document.getElementById('percent').textContent=`${percent}%`;
 document.getElementById('barFill').style.width=`${percent}%`;
 document.getElementById('remaining').textContent=total?`${remaining} REMAINING`:'NO ACHIEVEMENTS';
 const status=document.getElementById('status');
 status.className='status'+(data.stale?' stale':(!data.connected?' offline':''));
 status.textContent=data.status==='stale'?'Steam data is stale · showing last successful sync':(data.connected?'Steam connected':(data.status==='setup_required'?'Connect Steam in the setup page':'Steam connection unavailable'));
 if(!data.connected){pinnedEl.hidden=true;pinnedEl.innerHTML='';}
 else renderPinned(data.pinned_achievements||[]);
 const events=Array.isArray(data.new_unlocks)?data.new_unlocks:[];
 if(firstLoad){events.forEach(event=>{if(event.id)seenEvents.add(event.id);});firstLoad=false;}
 else{events.forEach(event=>{if(event.id&&!seenEvents.has(event.id)){seenEvents.add(event.id);toastQueue.push(event);}});showNextToast();}
}
async function migrateLegacyPins(data){
 if(!data.connected||!data.steamid||!data.appid)return data;
 const scope=`${data.steamid}:${data.appid}`;
 if(migratedLegacyScopes.has(scope))return data;
 // v1.4 stored pins in the OBS Browser Source's localStorage. Migrate those
 // pins to the local helper once so the dashboard and OBS share one pin list.
 const legacyKey=`steam-achievement-overlay:pins:${data.steamid}:${data.appid}`;
 try{
  const saved=JSON.parse(localStorage.getItem(legacyKey)||'[]');
  if(!Array.isArray(saved)||!saved.length||(data.pinned_api_names||[]).length){migratedLegacyScopes.add(scope);return data;}
  const valid=new Set((data.achievements||[]).map(item=>item.api_name));
  const api_names=saved.filter(name=>typeof name==='string'&&valid.has(name)).slice(0,3);
  if(!api_names.length){migratedLegacyScopes.add(scope);return data;}
  const response=await fetch('/api/pins',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_names})});
  const result=await response.json();
  if(response.ok&&result.ok){data.pinned_api_names=result.api_names;data.pinned_achievements=result.achievements;migratedLegacyScopes.add(scope);}
 }catch(_){/* Leave this scope eligible for a retry on the next refresh. */}
 return data;
}
async function fetchData(){
 try{const response=await fetch('/api/achievements',{cache:'no-store'});if(!response.ok)throw new Error('Could not read local achievement data.');let data=await response.json();data=await migrateLegacyPins(data);render(data);}
 catch(error){const status=document.getElementById('status');status.className='status offline';status.textContent='Local helper offline · start_overlay.bat must remain running';}
}
fetchData();setInterval(fetchData,3000);
</script>
</body>
</html>
